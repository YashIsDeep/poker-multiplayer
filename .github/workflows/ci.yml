name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install dependencies
        shell: pwsh
        run: |
          npm.cmd ci
          npm.cmd --prefix client ci

      - name: Server tests
        run: npm.cmd test

      - name: Client unit tests
        run: npm.cmd --prefix client run test

      - name: Client production build
        run: npm.cmd --prefix client run build

      - name: Package server for isolated browser tests
        run: npm.cmd run build:server

      - name: Install Playwright Chromium
        run: npm.cmd --prefix client exec -- playwright install chromium

      - name: Launcher and analytics security tests
        run: node --test scripts/auth-mode.test.mjs analytics/security.test.mjs

      - name: Browser E2E
        run: npm.cmd --prefix client run e2e:ci

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-diagnostics
          path: |
            client/test-results
            client/playwright-report
          if-no-files-found: ignore
