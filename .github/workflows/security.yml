name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Scan npm and resolved Maven dependencies
        shell: pwsh
        run: ./scripts/security-scan.ps1 -Scope Dependencies
      - name: Upload dependency inventories and scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-security-reports
          path: |
            artifacts/security/*-final.cdx.json
            artifacts/security/osv-*.json
          if-no-files-found: error
          retention-days: 14

  secrets:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history and working files for secrets
        shell: pwsh
        run: ./scripts/security-scan.ps1 -Scope Secrets
      - name: Upload redacted secret scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secret-security-reports
          path: artifacts/security/gitleaks-*-final.json
          if-no-files-found: error
          retention-days: 14
