# This file shadows the main application.yml on the test classpath.
spring:
  datasource:
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  session:
    jdbc:
      initialize-schema: always
    timeout: 30d

poker:
  hand-archive:
    # Spring context tests must not write into a real archive directory.
    enabled: false
    directory: target/test-hand-archive
