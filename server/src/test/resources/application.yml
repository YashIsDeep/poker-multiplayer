# This file shadows the main application.yml on the test classpath.
spring:
  datasource:
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  session:
    jdbc:
      initialize-schema: always
    timeout: 30d

poker:
  # Mirrors the production shape so the bindings and the startup seeding are
  # exercised, without depending on the shadowed main application.yml.
  moderation:
    # Same placeholder form as production, so the comma-separated env override
    # binding to List<String> is exercised rather than only the YAML list form.
    emails: ${POKER_MODERATOR_EMAILS:yashparth.gupta@gmail.com}
    dev-users-are-moderators: false
  hand-archive:
    # Spring context tests must not write into a real archive directory.
    enabled: false
    directory: target/test-hand-archive
