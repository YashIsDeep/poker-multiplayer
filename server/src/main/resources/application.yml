spring:
  datasource:
    url: jdbc:h2:file:./data/poker
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  session:
    jdbc:
      initialize-schema: always
    timeout: 30d

server:
  port: 8080

poker:
  dev-login: false
