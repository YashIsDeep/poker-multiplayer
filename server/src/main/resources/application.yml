spring:
  datasource:
    url: jdbc:h2:file:./data/poker
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  session:
    jdbc:
      initialize-schema: always
    timeout: 30d

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

poker:
  websocket:
    allowed-origins:
      - http://127.0.0.1:5173
      - http://localhost:5173
    max-message-size: 16384
    send-buffer-size: 262144
    send-time-limit: 10000
    time-to-first-message: 10000
  abuse:
    command-rate: 10
    command-burst: 20
    control-rate: 2
    control-burst: 5
    frame-rate: 100
    frame-burst: 200
    coarse-violation-threshold: 3
    coarse-violation-window: 10s
    cleanup-interval-ms: 60000
    registry-cap: 100000
    registry-ttl: 10m
  rooms:
    disconnected-grace: 30m
  gameplay:
    recovery-sweep-ms: 5000
