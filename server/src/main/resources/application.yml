spring:
  datasource:
    # Allow local app restarts and database tools to share the file through
    # H2's automatic mixed mode instead of competing for an exclusive lock.
    # Mixed mode listens for those tools over TCP: PokerApplication confines that
    # listener to loopback, since H2 otherwise binds every interface.
    url: jdbc:h2:file:./data/poker;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  session:
    jdbc:
      initialize-schema: always
    timeout: 12h

server:
  port: 8080
  # Honor X-Forwarded-Host/Proto from the production reverse proxy so OAuth
  # callbacks use the public HTTPS origin rather than the internal server URL.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}

poker:
  admin:
    live:
      enabled: ${POKER_ADMIN_LIVE_ENABLED:false}
      token: ${POKER_ADMIN_LIVE_TOKEN:}
  moderation:
    # Public tables are moderator-only. Entries are matched against the
    # verified provider email captured at sign-in.
    emails: ${POKER_MODERATOR_EMAILS:}
    # The dev login endpoint issues accounts with no provider email; the dev
    # profile turns this on so local and end-to-end runs can still create them.
    dev-users-are-moderators: false
  house-table:
    # One public table the lobby always shows, seeded at startup and never
    # garbage collected, so a signed-in player always has somewhere to sit.
    enabled: ${POKER_HOUSE_TABLE_ENABLED:true}
    name: ${POKER_HOUSE_TABLE_NAME:House Table}
  ranked:
    enabled: ${POKER_RANKED_ENABLED:false}
  hand-archive:
    # Compressed local analytics archive; independent of the database so it
    # keeps recording completed hands during a database outage.
    enabled: true
    directory: ./data/hand-archive
  websocket:
    heartbeat-interval: 5s
    allowed-origins:
      - http://127.0.0.1:5173
      - http://localhost:5173
    max-message-size: 16384
    send-buffer-size: 262144
    send-time-limit: 10000
    time-to-first-message: 10000
  abuse:
    command-rate: 10
    command-burst: 20
    control-rate: 2
    control-burst: 5
    frame-rate: 100
    frame-burst: 200
    # OAuth initiation intentionally creates an authorization-state session,
    # so bound it per transport peer before Spring stores that state.
    oauth-initiation-rate: 1
    oauth-initiation-burst: 5
    oauth-initiation-registry-cap: 10000
    oauth-initiation-registry-ttl: 10m
    lifecycle-frame-rate: 10
    lifecycle-frame-burst: 20
    # STOMP heartbeats are cheap but still traverse the inbound channel. This
    # allows normal clients ample jitter while bounding one-byte frame floods.
    heartbeat-frame-rate: 2
    heartbeat-frame-burst: 20
    max-subscriptions-per-socket: 8
    max-sockets-per-user: 4
    max-sockets-per-http-session: 4
    coarse-violation-threshold: 3
    coarse-violation-window: 10s
    cleanup-interval-ms: 60000
    registry-cap: 100000
    registry-ttl: 10m
  rooms:
    disconnected-grace: 10m
    member-disconnected-grace: 10m
    inactivity-timeout: 60m
    inactivity-warning: 5m
    cleanup-sweep-ms: 60000
  presence:
    reconnect-grace: 10s
  gameplay:
    recovery-sweep-ms: 5000
