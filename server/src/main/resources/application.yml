spring:
  datasource:
    url: jdbc:h2:file:./data/poker
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  session:
    jdbc:
      initialize-schema: always
    timeout: 30d

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

poker:
  websocket:
    allowed-origins:
      - http://127.0.0.1:5173
      - http://localhost:5173
    max-message-size: 16384
    send-buffer-size: 262144
    send-time-limit: 10000
    time-to-first-message: 10000
