spring:
  datasource:
    url: jdbc:h2:tcp://${DB_HOST:127.0.0.1}:${DB_PORT:9092}/./data/poker

server:
  address: 127.0.0.1

poker:
  moderation:
    # Dev logins carry no provider email, so without this nobody could create a
    # public table locally or in the end-to-end suite.
    dev-users-are-moderators: true
  admin:
    live:
      enabled: true
  hand-archive:
    # `npm run dev` starts the server with cwd=server/, so point the archive
    # at the same repo-root data directory the analytics app reads.
    directory: ../data/hand-archive
